<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sıfırdan Dijital Kazanç</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: white; text-align: center; padding: 50px 20px; margin: 0; }
        .container { max-width: 400px; margin: auto; background: #1e293b; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        img { width: 120px; height: 120px; border-radius: 50%; margin-bottom: 15px; border: 3px solid #38bdf8; }
        h1 { font-size: 24px; margin-bottom: 5px; color: #f8fafc; }
        p { color: #94a3b8; font-size: 15px; margin-bottom: 25px; line-height: 1.5; }
        .btn { display: block; width: 100%; padding: 16px; margin-bottom: 15px; background: #0284c7; color: white; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 16px; transition: 0.3s; box-sizing: border-box;}
        .btn:hover { background: #0369a1; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <!-- Maskot eklendiğinde resmi buraya koyacağız -->
        <img src="https://ui-avatars.com/api/?name=AI&background=38bdf8&color=fff&size=120" alt="Logo">
        
        <h1>Gizemli Dijital Göçebe</h1>
        <p>Yüzünü göstermeden, yapay zeka ile sıfır sermayeli kazanç sistemleri.</p>
        
        <!-- TELEGRAM LİNKİNİ AŞAĞIDAKİ YERE YAPIŞTIR -->
        <a href="https://t.me/SENIN_KANAL_LINKIN" class="btn">🚀 Ücretsiz Araçlar İçin Telegram'a Katıl</a>
        
    </div>
</body>
</html>
